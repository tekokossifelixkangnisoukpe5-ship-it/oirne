<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIT Admission Processing System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ait: { blue: '#0A4D68', dark: '#0A3A4F', teal: '#14B8A6', green: '#16A34A' }
          }
        }
      }
    }
  </script>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f4f8; }
    input, select, button { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useRef } = React;

    // ⚠️ URL du backend Render
    const API_URL = 'https://aiten-5shp.onrender.com/api';

    // ==================== TRADUCTIONS ====================
    const translations = {
      en: {
        login: { title: 'AIT ADMISSION PROCESSING SYSTEM', subtitle: 'This is where you want to go to University....', email: 'Email Address', loginBtn: 'Login', placeholder: 'Enter your email' },
        welcome: { hello: 'Hello', message: 'We are delighted to have you back to complete your application process. Please Click Continue to Review your application process', continue: 'Continue', thanks: 'Thanks For Your Cooperation' },
        step1: { title: 'Step 1: Please review/update your basic information', banner: 'Please Review/Update the details below information', changePhoto: 'Click to Change photo', firstName: 'First Name', middleName: 'Middle Name', lastName: 'Last Name', email: 'Email', contact: 'Contact number', otherContact: 'Other Contact If Any', gender: 'Select Gender', dob: 'Date of Birth', whatsapp: 'WhatsApp Contact', address: 'Home Address', country: 'Select Country of Origin', save: 'Save & Continue', male: 'Male', female: 'Female', other: 'Other' },
        step2: { title: 'STAGE 2: Please Review/Update your Programme Selections or Grades', complete: 'Complete Admission Information', note: 'Please check the minimum entry/admission requirements for each of the programs before applying for it.', selectProgram: 'Please Select which Program You want to Apply For', allowed: 'You are Allowed Three (3) Choices Ranked in order of Preference.', firstChoice: 'Select Your First Choice:', secondChoice: 'Select Your Second Choice »', thirdChoice: 'Select Your Third Choice »', qualificationTitle: 'Select Your highest qualification', resultsNote: 'Kindly click to select your highest qualification', iHaveResults: 'I have my results', awaiting: 'Awaiting Results', coreNote: 'The required Core Courses have been pre selected for you. Select NotDone for courses you did not take.', electiveNote: 'Enter the grades obtained in these courses.', selectCourses: 'Select Your Courses', selectGrades: 'Select Your Grades', save: 'Save & Continue' },
        step3: { title: 'You Are Required To Upload The Electronic Copies Of Your', certs: 'Certificates / Result Slip (E.G. WASSCE,WAEC,NECO,GCE) / Transcripts', note: 'Note: If your internet is weak, snap/scan your documents with your phone. If still difficult, send them to WhatsApp', whatsapp: '(+233577668816/+233503605459).', addName: 'Please add your fullname to the Whatsapp message. Thank you', uploadTitle: 'Upload Certificates/Transcripts/Result Slip', uploadBtn: 'Upload Documents', clickHere: 'Click here', multiNote: 'Note: You can upload multiple documents', save: 'Save & Continue' },
        common: { loading: 'Loading...', error: 'An error occurred', success: 'Success', logout: 'Logout' }
      },
      fr: {
        login: { title: 'SYSTÈME DE TRAITEMENT DES ADMISSIONS AIT', subtitle: "C'est ici que vous voulez aller à l'Université....", email: 'Adresse e-mail', loginBtn: 'Connexion', placeholder: 'Entrez votre e-mail' },
        welcome: { hello: 'Bonjour', message: 'Nous sommes ravis de vous revoir pour compléter votre processus de candidature. Veuillez cliquer sur Continuer pour revoir votre processus de candidature', continue: 'Continuer', thanks: 'Merci pour votre coopération' },
        step1: { title: 'Étape 1 : Veuillez revoir/mettre à jour vos informations de base', banner: 'Veuillez revoir/mettre à jour les détails ci-dessous', changePhoto: 'Cliquez pour changer la photo', firstName: 'Prénom', middleName: 'Deuxième prénom', lastName: 'Nom de famille', email: 'E-mail', contact: 'Numéro de contact', otherContact: 'Autre contact le cas échéant', gender: 'Sélectionner le genre', dob: 'Date de naissance', whatsapp: 'Contact WhatsApp', address: 'Adresse du domicile', country: "Sélectionner le pays d'origine", save: 'Enregistrer et Continuer', male: 'Masculin', female: 'Féminin', other: 'Autre' },
        step2: { title: 'ÉTAPE 2 : Veuillez revoir/mettre à jour vos sélections de programmes ou notes', complete: "Compléter les informations d'admission", note: "Veuillez vérifier les exigences minimales d'entrée pour chaque programme avant de postuler.", selectProgram: 'Veuillez sélectionner le programme pour lequel vous souhaitez postuler', allowed: 'Vous êtes autorisé à trois (3) choix classés par ordre de préférence.', firstChoice: 'Sélectionnez votre premier choix :', secondChoice: 'Sélectionnez votre deuxième choix »', thirdChoice: 'Sélectionnez votre troisième choix »', qualificationTitle: 'Sélectionnez votre plus haute qualification', resultsNote: 'Cliquez pour sélectionner votre plus haute qualification', iHaveResults: "J'ai mes résultats", awaiting: 'En attente de résultats', coreNote: 'Les cours de base ont été présélectionnés. Choisissez NotDone pour les cours non suivis.', electiveNote: 'Saisissez les notes obtenues dans ces cours.', selectCourses: 'Sélectionnez vos cours', selectGrades: 'Sélectionnez vos notes', save: 'Enregistrer et Continuer' },
        step3: { title: 'Vous êtes tenu de télécharger les copies électroniques de vos', certs: 'Certificats / Relevé de notes (ex. WASSCE, WAEC, NECO, GCE) / Relevés', note: "Note : Si votre connexion est faible, photographiez/scannnez vos documents. En cas de difficulté, envoyez-les sur WhatsApp", whatsapp: '(+233577668816/+233503605459).', addName: 'Ajoutez votre nom complet au message WhatsApp. Merci', uploadTitle: 'Télécharger Certificats/Relevés/Résultat', uploadBtn: 'Télécharger les documents', clickHere: 'Cliquez ici', multiNote: 'Note : Vous pouvez télécharger plusieurs documents', save: 'Enregistrer et Continuer' },
        common: { loading: 'Chargement...', error: "Une erreur s'est produite", success: 'Succès', logout: 'Déconnexion' }
      }
    };

    // ==================== API ====================
    async function api(method, endpoint, body = null, isFormData = false) {
      const headers = {};
      const token = localStorage.getItem('ait_token');
      if (token) headers['Authorization'] = `Bearer ${token}`;
      if (!isFormData) headers['Content-Type'] = 'application/json';
      const opts = { method, headers };
      if (body) opts.body = isFormData ? body : JSON.stringify(body);
      const res = await fetch(`${API_URL}${endpoint}`, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || 'Error ' + res.status);
      return data;
    }

    // ==================== AUTH CONTEXT ====================
    const AuthContext = createContext(null);

    function AuthProvider({ children }) {
      const [user, setUser] = useState(null);
      const [token, setToken] = useState(localStorage.getItem('ait_token'));
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        if (token) {
          api('GET', '/auth/me')
            .then(data => setUser(data.user))
            .catch(() => {
              localStorage.removeItem('ait_token');
              setToken(null);
            })
            .finally(() => setLoading(false));
        } else setLoading(false);
      }, [token]);

      const login = async (email) => {
        const data = await api('POST', '/auth/login', { email });
        localStorage.setItem('ait_token', data.token);
        setToken(data.token);
        setUser(data.user);
      };

      const logout = () => {
        localStorage.removeItem('ait_token');
        setToken(null);
        setUser(null);
      };

      const updateUser = (u) => setUser(u);

      return (
        <AuthContext.Provider value={{ user, token, loading, login, logout, updateUser }}>
          {children}
        </AuthContext.Provider>
      );
    }

    const useAuth = () => useContext(AuthContext);

    // ==================== LANGUAGE ====================
    function useLang() {
      const [lang, setLang] = useState(localStorage.getItem('ait_lang') || 'fr');
      const t = (section, key) => (translations[lang] && translations[lang][section] && translations[lang][section][key]) || key;
      const changeLang = (l) => { setLang(l); localStorage.setItem('ait_lang', l); };
      return { lang, t, changeLang };
    }

    function LanguageSwitcher() {
      const { lang, changeLang } = useLang();
      return (
        <div className="fixed top-2 right-2 z-50 flex gap-1 bg-white rounded-full shadow px-2 py-1">
          <button onClick={() => changeLang('en')} className={`px-2 py-1 text-xs rounded-full ${lang === 'en' ? 'bg-ait-blue text-white' : 'text-gray-600'}`}>EN</button>
          <button onClick={() => changeLang('fr')} className={`px-2 py-1 text-xs rounded-full ${lang === 'fr' ? 'bg-ait-blue text-white' : 'text-gray-600'}`}>FR</button>
        </div>
      );
    }

    // ==================== PAGES ====================
    function LoginPage({ onLoginSuccess }) {
      const { login } = useAuth();
      const { t } = useLang();
      const [email, setEmail] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!email.trim()) return setError('Email required');
        setLoading(true);
        setError('');
        try {
          await login(email.trim());
          onLoginSuccess();
        } catch (err) {
          setError(err.message || 'Login failed');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col">
          <div className="bg-ait-blue flex-1 flex flex-col items-center justify-center px-6 pt-8 pb-16">
            <div className="bg-white rounded-full p-4 shadow-lg mb-8 w-40 h-40 flex items-center justify-center">
              <div className="text-center">
                <div className="text-3xl font-bold text-ait-blue">AIT</div>
                <div className="text-[10px] font-semibold text-ait-blue leading-tight mt-1">ACCRA INSTITUTE<br/>OF<br/>TECHNOLOGY</div>
                <div className="text-[9px] text-red-600 italic mt-1">University of The Future....</div>
              </div>
            </div>
            <h1 className="text-white text-3xl md:text-4xl font-bold text-center leading-tight mb-4">{t('login', 'title')}</h1>
            <p className="text-white/90 text-center text-sm max-w-xs">{t('login', 'subtitle')}</p>
          </div>
          <div className="bg-white rounded-t-3xl -mt-8 px-6 pt-8 pb-10 shadow-lg relative z-10">
            <form onSubmit={handleSubmit} className="max-w-md mx-auto space-y-6">
              <div>
                <label className="block text-gray-600 text-sm mb-2">{t('login', 'email')}</label>
                <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder={t('login', 'placeholder')}
                  className="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-ait-blue" required />
              </div>
              {error && <p className="text-red-500 text-sm">{error}</p>}
              <button type="submit" disabled={loading}
                className="w-full bg-ait-teal hover:bg-teal-600 text-white font-semibold py-3 rounded-lg transition disabled:opacity-50">
                {loading ? t('common', 'loading') : t('login', 'loginBtn')}
              </button>
            </form>
          </div>
        </div>
      );
    }

    function WelcomePage({ goTo }) {
      const { user } = useAuth();
      const { t } = useLang();
      const fullName = user ? `${user.firstName} ${user.middleName || ''} ${user.lastName}`.trim() : '';

      return (
        <div className="min-h-screen bg-gray-100 flex flex-col items-center justify-center px-6 py-12">
          <h1 className="text-2xl md:text-3xl font-bold text-gray-900 text-center mb-6">{t('welcome', 'hello')} {fullName},</h1>
          <p className="text-gray-700 text-center max-w-md mb-8 leading-relaxed">{t('welcome', 'message')}</p>
          <button onClick={() => goTo('basic-info')} className="bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-10 rounded-lg text-lg shadow">
            {t('welcome', 'continue')}
          </button>
          <p className="mt-10 text-green-600 font-semibold text-lg">{t('welcome', 'thanks')}</p>
        </div>
      );
    }

    function BasicInfoPage({ goTo }) {
      const { user, updateUser } = useAuth();
      const { t } = useLang();
      const fileRef = useRef();
      const [form, setForm] = useState({
        firstName: '', middleName: '', lastName: '', email: '', contactNumber: '', otherContact: '',
        gender: 'Male', dateOfBirth: '', whatsappContact: '', homeAddress: '', countryOfOrigin: 'Togo'
      });
      const [photoPreview, setPhotoPreview] = useState(null);
      const [photoFile, setPhotoFile] = useState(null);
      const [loading, setLoading] = useState(false);
      const [msg, setMsg] = useState('');

      useEffect(() => {
        if (user) {
          setForm({
            firstName: user.firstName || '',
            middleName: user.middleName || '',
            lastName: user.lastName || '',
            email: user.email || '',
            contactNumber: user.contactNumber || '',
            otherContact: user.otherContact || '',
            gender: user.gender || 'Male',
            dateOfBirth: user.dateOfBirth ? String(user.dateOfBirth).split('T')[0] : '',
            whatsappContact: user.whatsappContact || '',
            homeAddress: user.homeAddress || '',
            countryOfOrigin: user.countryOfOrigin || 'Togo',
          });
          if (user.photo) {
            const base = API_URL.replace('/api', '');
            setPhotoPreview(user.photo.startsWith('http') ? user.photo : base + user.photo);
          }
        }
      }, [user]);

      const handleChange = (e) => setForm({ ...form, [e.target.name]: e.target.value });
      const handlePhoto = (e) => {
        const f = e.target.files && e.target.files[0];
        if (f) { setPhotoFile(f); setPhotoPreview(URL.createObjectURL(f)); }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setMsg('');
        try {
          const fd = new FormData();
          Object.keys(form).forEach(k => { if (k !== 'email') fd.append(k, form[k]); });
          if (photoFile) fd.append('photo', photoFile);
          const data = await api('PUT', '/application/basic-info', fd, true);
          updateUser(data.user);
          setMsg(t('common', 'success'));
          setTimeout(() => goTo('programme'), 600);
        } catch (err) {
          setMsg(err.message || t('common', 'error'));
        } finally {
          setLoading(false);
        }
      };

      const countries = ['Togo', 'Ghana', 'Nigeria', 'Benin', 'Ivory Coast', 'Burkina Faso', 'Senegal', 'Mali', 'Niger', 'Cameroon', 'Other'];

      return (
        <div className="min-h-screen bg-gray-100 pb-10">
          <div className="bg-white shadow-sm px-4 py-4">
            <h1 className="text-xl font-bold text-gray-900">{t('step1', 'title')}</h1>
          </div>
          <div className="px-4 mt-4">
            <div className="bg-cyan-500 text-white text-center py-4 rounded-lg font-medium mb-6">{t('step1', 'banner')}</div>
            <form onSubmit={handleSubmit} className="bg-white rounded-xl shadow p-5 space-y-4 max-w-lg mx-auto">
              <div className="flex flex-col items-center">
                <div className="w-40 h-48 bg-gray-200 rounded overflow-hidden mb-2 border">
                  {photoPreview ? <img src={photoPreview} alt="Photo" className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-gray-400 text-sm">No Photo</div>}
                </div>
                <button type="button" onClick={() => fileRef.current && fileRef.current.click()} className="bg-green-600 text-white text-sm px-4 py-2 rounded">{t('step1', 'changePhoto')}</button>
                <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handlePhoto} />
              </div>
              {['firstName', 'middleName', 'lastName'].map(name => (
                <div key={name}>
                  <label className="block text-sm font-medium text-gray-700 mb-1">{t('step1', name)}</label>
                  <input name={name} value={form[name]} onChange={handleChange} className="w-full border border-gray-300 rounded px-3 py-2 outline-none focus:ring-2 focus:ring-ait-blue" required={name !== 'middleName'} />
                </div>
              ))}
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">{t('step1', 'email')}</label>
                <input value={form.email} disabled className="w-full border border-gray-200 rounded px-3 py-2 bg-gray-50 text-gray-500" />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">{t('step1', 'contact')}</label>
                <input name="contactNumber" value={form.contactNumber} onChange={handleChange} className="w-full border border-gray-300 rounded px-3 py-2 outline-none focus:ring-2 focus:ring-ait-blue" required />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">{t('step1', 'otherContact')}</label>
                <input name="otherContact" value={form.otherContact} onChange={handleChange} className="w-full border border-gray-300 rounded px-3 py-2 outline-none focus:ring-2 focus:ring-ait-blue" />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">{t('step1', 'gender')}</label>
                <select name="gender" value={form.gender} onChange={handleChange} className="w-full border border-gray-300 rounded px-3 py-2 outline-none">
                  <option value="Male">{t('step1', 'male')}</option>
                  <option value="Female">{t('step1', 'female')}</option>
                  <option value="Other">{t('step1', 'other')}</option>
                </select>
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">{t('step1', 'dob')}</label>
                <input type="date" name="dateOfBirth" value={form.dateOfBirth} onChange={handleChange} className="w-full border border-gray-300 rounded px-3 py-2 outline-none focus:ring-2 focus:ring-ait-blue" required />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">{t('step1', 'whatsapp')}</label>
                <input name="whatsappContact" value={form.whatsappContact} onChange={handleChange} className="w-full border border-gray-300 rounded px-3 py-2 outline-none focus:ring-2 focus:ring-ait-blue" required />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">{t('step1', 'address')}</label>
                <input name="homeAddress" value={form.homeAddress} onChange={handleChange} className="w-full border border-gray-300 rounded px-3 py-2 outline-none focus:ring-2 focus:ring-ait-blue" required />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">{t('step1', 'country')}</label>
                <select name="countryOfOrigin" value={form.countryOfOrigin} onChange={handleChange} className="w-full border border-gray-300 rounded px-3 py-2 outline-none">
                  {countries.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              {msg && <p className={`text-sm ${msg.toLowerCase().includes('error') || msg.toLowerCase().includes('erreur') ? 'text-red-500' : 'text-green-600'}`}>{msg}</p>}
              <button type="submit" disabled={loading} className="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg disabled:opacity-50">
                {loading ? t('common', 'loading') : t('step1', 'save')}
              </button>
            </form>
          </div>
        </div>
      );
    }

    const PROGRAMMES = [
      'Baccalauréat en génie (BEng) en génie électrique',
      'Bachelor of Engineering (BEng) in Computer Engineering',
      'Bachelor of Engineering (BEng) in Civil Engineering',
      'Bachelor of Engineering (BEng) in Mechanical Engineering',
      'Bachelor of Science (BSc) in Information Technology',
      'Bachelor of Science (BSc) in Computer Science',
      'Bachelor of Business Administration (BBA)',
      'Bachelor of Science (BSc) in Accounting',
    ];
    const COURSES = ['Mathematics', 'Sciences Physiques', 'French', 'Music', 'Technical Drawing', 'Anglais', 'Histoire et Geographie', 'Education Physique et Sport', 'Biology', 'Chemistry', 'Economics', 'Accounting'];
    const GRADES = ['A1', 'B2', 'B3', 'C4', 'C5', 'C6', 'D7', 'E8', 'F9', 'NotDone'];

    function ProgrammePage({ goTo }) {
      const { t } = useLang();
      const [choice1, setChoice1] = useState(PROGRAMMES[0]);
      const [choice2, setChoice2] = useState(PROGRAMMES[1]);
      const [choice3, setChoice3] = useState(PROGRAMMES[2]);
      const [qualification, setQualification] = useState('Baccalaureat');
      const [hasResults, setHasResults] = useState(true);
      const [grades, setGrades] = useState(COURSES.slice(0, 8).map(c => ({ course: c, grade: 'B2' })));
      const [loading, setLoading] = useState(false);
      const [msg, setMsg] = useState('');

      useEffect(() => {
        api('GET', '/application').then(data => {
          const app = data.application;
          if (app && app.programmeChoices && app.programmeChoices.length) {
            setChoice1(app.programmeChoices[0].programme || PROGRAMMES[0]);
            setChoice2((app.programmeChoices[1] && app.programmeChoices[1].programme) || PROGRAMMES[1]);
            setChoice3((app.programmeChoices[2] && app.programmeChoices[2].programme) || PROGRAMMES[2]);
          }
          if (app && app.highestQualification) setQualification(app.highestQualification);
          if (app && app.courseGrades && app.courseGrades.length) setGrades(app.courseGrades);
        }).catch(() => {});
      }, []);

      const updateGrade = (i, field, value) => {
        const next = [...grades];
        next[i] = { ...next[i], [field]: value };
        setGrades(next);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setMsg('');
        try {
          await api('PUT', '/application/programme-choices', {
            programmeChoices: [{ programme: choice1 }, { programme: choice2 }, { programme: choice3 }]
          });
          await api('PUT', '/application/grades', {
            highestQualification: qualification,
            hasResults,
            awaitingResults: !hasResults,
            courseGrades: grades.map(g => ({ ...g, isCore: ['Mathematics', 'Sciences Physiques'].includes(g.course) }))
          });
          setMsg(t('common', 'success'));
          setTimeout(() => goTo('documents'), 600);
        } catch (err) {
          setMsg(err.message || t('common', 'error'));
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-gray-100 pb-10">
          <div className="bg-white shadow-sm px-4 py-4">
            <h1 className="text-xl font-bold text-gray-900">{t('step2', 'title')}</h1>
          </div>
          <div className="px-4 mt-4 max-w-lg mx-auto space-y-6">
            <div className="bg-gray-200 text-gray-700 text-sm py-2 px-4 rounded">🎓 {t('step2', 'complete')}</div>
            <p className="text-sm text-gray-600 italic"><strong>Note:</strong> {t('step2', 'note')}</p>
            <form onSubmit={handleSubmit} className="bg-white rounded-xl shadow p-5 space-y-5">
              <div>
                <h2 className="font-semibold text-gray-800 mb-1">{t('step2', 'selectProgram')}</h2>
                <p className="text-red-600 text-sm font-medium mb-4">{t('step2', 'allowed')}</p>
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-green-700 mb-1">{t('step2', 'firstChoice')}</label>
                    <select value={choice1} onChange={e => setChoice1(e.target.value)} className="w-full border-2 border-blue-400 rounded px-3 py-2 outline-none">
                      {PROGRAMMES.map(p => <option key={p} value={p}>{p}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">{t('step2', 'secondChoice')}</label>
                    <select value={choice2} onChange={e => setChoice2(e.target.value)} className="w-full border border-gray-300 rounded px-3 py-2 outline-none">
                      {PROGRAMMES.map(p => <option key={p} value={p}>{p}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">{t('step2', 'thirdChoice')}</label>
                    <select value={choice3} onChange={e => setChoice3(e.target.value)} className="w-full border border-gray-300 rounded px-3 py-2 outline-none">
                      {PROGRAMMES.map(p => <option key={p} value={p}>{p}</option>)}
                    </select>
                  </div>
                </div>
              </div>
              <div className="border-t pt-4">
                <p className="text-sm text-gray-600 mb-2">{t('step2', 'resultsNote')} <button type="button" className="text-blue-600 underline" onClick={() => setHasResults(true)}>{t('step2', 'iHaveResults')}</button></p>
                <p className="text-sm text-red-600 mb-3">✕ <button type="button" className="text-blue-600 underline" onClick={() => setHasResults(false)}>{t('step2', 'awaiting')}</button></p>
                <label className="block text-sm font-medium text-gray-700 mb-1">{t('step2', 'qualificationTitle')}</label>
                <select value={qualification} onChange={e => setQualification(e.target.value)} className="w-full border border-gray-300 rounded px-3 py-2 outline-none mb-4">
                  <option value="Baccalaureat">Baccalaureat</option>
                  <option value="WASSCE">WASSCE</option>
                  <option value="WAEC">WAEC</option>
                  <option value="NECO">NECO</option>
                  <option value="GCE">GCE</option>
                  <option value="Other">Other</option>
                </select>
                <p className="text-sm text-gray-600 mb-2">{t('step2', 'coreNote')}</p>
                <p className="text-sm text-gray-600 mb-4">{t('step2', 'electiveNote')}</p>
                <div className="grid grid-cols-2 gap-2 mb-2">
                  <span className="text-red-600 font-medium text-sm">{t('step2', 'selectCourses')}</span>
                  <span className="text-red-600 font-medium text-sm text-right">{t('step2', 'selectGrades')}</span>
                </div>
                {grades.map((g, i) => (
                  <div key={i} className="grid grid-cols-2 gap-2 mb-2">
                    <select value={g.course} onChange={e => updateGrade(i, 'course', e.target.value)} className="border border-gray-300 rounded px-2 py-1.5 text-sm outline-none">
                      {COURSES.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                    <select value={g.grade} onChange={e => updateGrade(i, 'grade', e.target.value)} className="border border-gray-300 rounded px-2 py-1.5 text-sm outline-none">
                      {GRADES.map(gr => <option key={gr} value={gr}>{gr}</option>)}
                    </select>
                  </div>
                ))}
              </div>
              {msg && <p className={`text-sm ${msg.toLowerCase().includes('error') || msg.toLowerCase().includes('erreur') ? 'text-red-500' : 'text-green-600'}`}>{msg}</p>}
              <button type="submit" disabled={loading} className="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg disabled:opacity-50">
                {loading ? t('common', 'loading') : t('step2', 'save')}
              </button>
            </form>
          </div>
        </div>
      );
    }

    function DocumentsPage({ goTo }) {
      const { logout } = useAuth();
      const { t } = useLang();
      const fileRef = useRef();
      const [files, setFiles] = useState([]);
      const [loading, setLoading] = useState(false);
      const [submitted, setSubmitted] = useState(false);
      const [msg, setMsg] = useState('');

      const handleFiles = (e) => { if (e.target.files) setFiles(Array.from(e.target.files)); };

      const handleUpload = async () => {
        if (files.length === 0) return setMsg('Please select at least one document');
        setLoading(true);
        setMsg('');
        try {
          const fd = new FormData();
          files.forEach(f => fd.append('documents', f));
          await api('POST', '/application/documents', fd, true);
          setMsg('Documents uploaded successfully');
        } catch (err) {
          setMsg(err.message || t('common', 'error'));
        } finally {
          setLoading(false);
        }
      };

      const handleSubmit = async () => {
        setLoading(true);
        setMsg('');
        try {
          await api('POST', '/application/submit');
          setSubmitted(true);
        } catch (err) {
          setMsg(err.message || t('common', 'error'));
        } finally {
          setLoading(false);
        }
      };

      if (submitted) {
        return (
          <div className="min-h-screen bg-gray-100 flex flex-col items-center justify-center px-6">
            <div className="bg-white rounded-xl shadow-lg p-8 max-w-md text-center">
              <div className="text-6xl mb-4">✅</div>
              <h1 className="text-2xl font-bold text-green-600 mb-4">Application Submitted!</h1>
              <p className="text-gray-600 mb-6">Thank you for completing your application to Accra Institute of Technology.</p>
              <button onClick={() => { logout(); goTo('login'); }} className="bg-ait-blue text-white px-6 py-2 rounded-lg">{t('common', 'logout')}</button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gray-100 pb-10">
          <div className="px-4 mt-6 max-w-lg mx-auto">
            <div className="bg-white rounded-xl shadow p-5 space-y-4">
              <p className="text-gray-800 font-medium">{t('step3', 'title')} <span className="text-pink-600 font-semibold">{t('step3', 'certs')}</span></p>
              <p className="text-green-700 text-sm leading-relaxed"><strong>Note:</strong> {t('step3', 'note')} <span className="text-pink-600 font-medium">{t('step3', 'whatsapp')}</span> {t('step3', 'addName')}</p>
              <div className="border-t pt-4">
                <h3 className="text-green-700 font-semibold mb-1">Step 3</h3>
                <p className="text-sm text-gray-700 mb-4">{t('step3', 'uploadTitle')}</p>
                <div className="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center">
                  <div className="text-3xl mb-2">📤</div>
                  <p className="text-blue-600 font-medium">{t('step3', 'uploadBtn')} <button type="button" onClick={() => fileRef.current && fileRef.current.click()} className="text-pink-600 underline">{t('step3', 'clickHere')}</button></p>
                  <p className="text-pink-500 text-sm mt-1">{t('step3', 'multiNote')}</p>
                  <input ref={fileRef} type="file" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" className="hidden" onChange={handleFiles} />
                </div>
                {files.length > 0 && (
                  <ul className="mt-3 space-y-1">
                    {files.map((f, i) => <li key={i} className="text-sm text-gray-600 truncate">📄 {f.name}</li>)}
                  </ul>
                )}
                {msg && <p className={`text-sm mt-2 ${msg.toLowerCase().includes('success') || msg.toLowerCase().includes('uploaded') ? 'text-green-600' : 'text-red-500'}`}>{msg}</p>}
                <button onClick={handleUpload} disabled={loading || files.length === 0} className="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg disabled:opacity-50">
                  {loading ? t('common', 'loading') : 'Upload Selected Files'}
                </button>
                <button onClick={handleSubmit} disabled={loading} className="w-full mt-3 bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg disabled:opacity-50">
                  {loading ? t('common', 'loading') : t('step3', 'save')}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==================== APP (navigation simple sans React Router) ====================
    function App() {
      const { token, loading } = useAuth();
      const [page, setPage] = useState('login');

      useEffect(() => {
        if (!loading) {
          if (token) setPage('welcome');
          else setPage('login');
        }
      }, [token, loading]);

      if (loading) {
        return <div className="flex items-center justify-center min-h-screen text-gray-600">Loading...</div>;
      }

      return (
        <div>
          <LanguageSwitcher />
          {page === 'login' && <LoginPage onLoginSuccess={() => setPage('welcome')} />}
          {page === 'welcome' && token && <WelcomePage goTo={setPage} />}
          {page === 'basic-info' && token && <BasicInfoPage goTo={setPage} />}
          {page === 'programme' && token && <ProgrammePage goTo={setPage} />}
          {page === 'documents' && token && <DocumentsPage goTo={setPage} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <AuthProvider>
        <App />
      </AuthProvider>
    );
  </script>
</body>
</html>
