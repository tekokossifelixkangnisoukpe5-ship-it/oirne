<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>AIT Admission Processing System</title>
  <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/tekokossifelixkangnisoukpe5-ship-it/photo/main/33181-1.jpg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ait: { blue: '#0A4D68', dark: '#083344', teal: '#0D9488', green: '#15803D', gold: '#C9A227' }
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f1f5f9; }
    input, select, button, textarea { font-family: inherit; }
    .ait-title { border-bottom: 3px solid #0A4D68; padding-bottom: 8px; margin-bottom: 16px; }
    .card { background: white; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04); }
    .btn-primary { background: #0A4D68; color: white; }
    .btn-primary:hover { background: #083344; }
    .btn-success { background: #15803D; color: white; }
    .btn-success:hover { background: #166534; }
    .btn-danger { background: #DC2626; color: white; }
    .btn-danger:hover { background: #B91C1C; }
    @media (max-width: 640px) {
      .mobile-pad { padding-left: 12px; padding-right: 12px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useContext, createContext, useRef } = React;

    const API_URL = 'https://aiten-bg3s.onrender.com';
    const UPLOAD_BASE = 'https://aiten-5shp.onrender.com';
    const AIT_LOGO = 'https://raw.githubusercontent.com/tekokossifelixkangnisoukpe5-ship-it/photo/main/AIT%20logo.png';
    const FAVICON = 'https://raw.githubusercontent.com/tekokossifelixkangnisoukpe5-ship-it/photo/main/33181-1.jpg';

    const translations = {
      en: {
        login: { title: 'AIT ADMISSION PROCESSING SYSTEM', subtitle: 'This is where you want to go to University....', email: 'Email Address', loginBtn: 'Login', placeholder: 'Enter your email' },
        welcome: { hello: 'Hello', message: 'We are delighted to have you back to complete your application process. Please Click Continue to Review your application process', continue: 'Continue', thanks: 'Thanks For Your Cooperation' },
        step1: { title: 'Step 1: Please review/update your basic information', banner: 'Please Review/Update the details below', changePhoto: 'Click to Change photo', firstName: 'First Name', middleName: 'Middle Name', lastName: 'Last Name', email: 'Email', contact: 'Contact number', otherContact: 'Other Contact If Any', gender: 'Select Gender', dob: 'Date of Birth', whatsapp: 'WhatsApp Contact', address: 'Home Address', country: 'Select Country of Origin', save: 'Save & Continue', male: 'Male', female: 'Female', other: 'Other' },
        step2: { title: 'STAGE 2: Please Review/Update your Programme Selections or Grades', complete: 'Complete Admission Information', note: 'Please check the minimum entry/admission requirements for each of the programs before applying for it.', selectProgram: 'Please Select which Program You want to Apply For', allowed: 'You are Allowed Three (3) Choices Ranked in order of Preference.', firstChoice: 'Select Your First Choice:', secondChoice: 'Select Your Second Choice »', thirdChoice: 'Select Your Third Choice »', qualificationTitle: 'Select Your highest qualification', resultsNote: 'Click to select your highest qualification', iHaveResults: 'I have my results', awaiting: 'Awaiting Results', coreNote: 'Core courses are pre-selected. Choose NotDone for courses you did not take.', electiveNote: 'Enter the grades obtained in these courses.', selectCourses: 'Select Your Courses', selectGrades: 'Select Your Grades', save: 'Save & Continue' },
        step3: { title: 'Upload your certificates / result slips / transcripts', certs: 'Certificates / Result Slip (WASSCE, WAEC, NECO, GCE) / Transcripts', note: 'If your connection is weak, snap/scan documents with your phone. You can also send them via WhatsApp', whatsapp: '(+233577668816 / +233503605459)', addName: 'Please add your full name to the WhatsApp message. Thank you.', uploadTitle: 'Upload Certificates / Transcripts / Result Slip', uploadBtn: 'Upload Documents', clickHere: 'Click here', multiNote: 'You can upload multiple documents', save: 'Submit Application', existing: 'Your uploaded documents', delete: 'Delete', noDocs: 'No documents uploaded yet' },
        common: { loading: 'Loading...', error: 'An error occurred', success: 'Success', logout: 'Logout', admin: 'Admin' },
        submitted: { title: 'Application Submitted Successfully', message: 'Thank you for completing your application to Accra Institute of Technology. Our admissions team will review your file and contact you soon.', back: 'Back to Home' },
        admin: { title: 'AIT Admissions Admin', password: 'Admin Password', login: 'Access Admin', search: 'Search student...', all: 'All Students', detail: 'Student Details', status: 'Status', programmes: 'Programme Choices', grades: 'Grades', documents: 'Documents', photo: 'Photo', noData: 'No applications yet', changeStatus: 'Change status', close: 'Close' }
      },
      fr: {
        login: { title: 'SYSTÈME DE TRAITEMENT DES ADMISSIONS AIT', subtitle: "C'est ici que vous voulez aller à l'Université....", email: 'Adresse e-mail', loginBtn: 'Connexion', placeholder: 'Entrez votre e-mail' },
        welcome: { hello: 'Bonjour', message: 'Nous sommes ravis de vous revoir pour compléter votre processus de candidature. Veuillez cliquer sur Continuer pour revoir votre processus.', continue: 'Continuer', thanks: 'Merci pour votre coopération' },
        step1: { title: 'Étape 1 : Informations de base', banner: 'Veuillez revoir / mettre à jour les détails ci-dessous', changePhoto: 'Changer la photo', firstName: 'Prénom', middleName: 'Deuxième prénom', lastName: 'Nom de famille', email: 'E-mail', contact: 'Numéro de contact', otherContact: 'Autre contact', gender: 'Genre', dob: 'Date de naissance', whatsapp: 'Contact WhatsApp', address: 'Adresse du domicile', country: "Pays d'origine", save: 'Enregistrer et Continuer', male: 'Masculin', female: 'Féminin', other: 'Autre' },
        step2: { title: 'ÉTAPE 2 : Programmes et notes', complete: "Informations d'admission", note: "Vérifiez les exigences minimales d'entrée pour chaque programme avant de postuler.", selectProgram: 'Sélectionnez le programme pour lequel vous postulez', allowed: 'Vous avez droit à trois (3) choix classés par ordre de préférence.', firstChoice: 'Premier choix :', secondChoice: 'Deuxième choix »', thirdChoice: 'Troisième choix »', qualificationTitle: 'Plus haute qualification', resultsNote: 'Sélectionnez votre plus haute qualification', iHaveResults: "J'ai mes résultats", awaiting: 'En attente de résultats', coreNote: 'Cours de base présélectionnés. Choisissez NotDone pour les cours non suivis.', electiveNote: 'Saisissez les notes obtenues.', selectCourses: 'Cours', selectGrades: 'Notes', save: 'Enregistrer et Continuer' },
        step3: { title: 'Téléversement des documents', certs: 'Certificats / Relevés (WASSCE, WAEC, NECO, GCE) / Transcripts', note: 'Si la connexion est faible, photographiez vos documents. Vous pouvez aussi les envoyer via WhatsApp', whatsapp: '(+233577668816 / +233503605459)', addName: 'Ajoutez votre nom complet au message WhatsApp. Merci.', uploadTitle: 'Téléverser certificats / relevés', uploadBtn: 'Téléverser', clickHere: 'Cliquez ici', multiNote: 'Vous pouvez téléverser plusieurs documents', save: 'Soumettre la candidature', existing: 'Documents déjà téléversés', delete: 'Supprimer', noDocs: 'Aucun document téléversé' },
        common: { loading: 'Chargement...', error: "Une erreur s'est produite", success: 'Succès', logout: 'Déconnexion', admin: 'Admin' },
        submitted: { title: 'Candidature soumise avec succès', message: "Merci d'avoir complété votre candidature à Accra Institute of Technology. Notre équipe des admissions examinera votre dossier et vous contactera bientôt.", back: "Retour à l'accueil" },
        admin: { title: 'Admin Admissions AIT', password: 'Mot de passe Admin', login: 'Accéder', search: 'Rechercher un étudiant...', all: 'Tous les étudiants', detail: "Détails de l'étudiant", status: 'Statut', programmes: 'Choix de programmes', grades: 'Notes', documents: 'Documents', photo: 'Photo', noData: 'Aucune candidature', changeStatus: 'Changer le statut', close: 'Fermer' }
      }
    };

    async function api(method, endpoint, body = null, isFormData = false, extraHeaders = {}) {
      const headers = { ...extraHeaders };
      const token = localStorage.getItem('ait_token');
      if (token) headers['Authorization'] = `Bearer ${token}`;
      if (!isFormData) headers['Content-Type'] = 'application/json';
      const opts = { method, headers };
      if (body) opts.body = isFormData ? body : JSON.stringify(body);
      const res = await fetch(`${API_URL}${endpoint}`, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || 'Error ' + res.status);
      return data;
    }

    const AuthContext = createContext(null);
    function AuthProvider({ children }) {
      const [user, setUser] = useState(null);
      const [token, setToken] = useState(localStorage.getItem('ait_token'));
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        if (token) {
          api('GET', '/auth/me')
            .then(data => setUser(data.user))
            .catch(() => { localStorage.removeItem('ait_token'); setToken(null); })
            .finally(() => setLoading(false));
        } else setLoading(false);
      }, [token]);

      const login = async (email) => {
        const data = await api('POST', '/auth/login', { email });
        localStorage.setItem('ait_token', data.token);
        setToken(data.token);
        setUser(data.user);
      };
      const logout = () => { localStorage.removeItem('ait_token'); setToken(null); setUser(null); };
      const updateUser = (u) => setUser(u);

      return (
        <AuthContext.Provider value={{ user, token, loading, login, logout, updateUser }}>
          {children}
        </AuthContext.Provider>
      );
    }
    const useAuth = () => useContext(AuthContext);

    function useLang() {
      const [lang, setLang] = useState(localStorage.getItem('ait_lang') || 'fr');
      const t = (s, k) => (translations[lang] && translations[lang][s] && translations[lang][s][k]) || k;
      const changeLang = (l) => { setLang(l); localStorage.setItem('ait_lang', l); };
      return { lang, t, changeLang };
    }

    function LanguageSwitcher() {
      const { lang, changeLang } = useLang();
      return (
        <div className="fixed top-3 right-3 z-50 flex gap-1 bg-white/95 backdrop-blur rounded-full shadow-md px-1.5 py-1 border border-gray-200">
          <button onClick={() => changeLang('en')} className={`px-2.5 py-1 text-xs font-semibold rounded-full ${lang === 'en' ? 'bg-ait-blue text-white' : 'text-gray-600'}`}>EN</button>
          <button onClick={() => changeLang('fr')} className={`px-2.5 py-1 text-xs font-semibold rounded-full ${lang === 'fr' ? 'bg-ait-blue text-white' : 'text-gray-600'}`}>FR</button>
        </div>
      );
    }

    function PageHeader({ title }) {
      return (
        <div className="bg-white border-b border-gray-200 px-4 py-4 sm:px-6">
          <div className="max-w-2xl mx-auto">
            <h1 className="text-lg sm:text-xl font-bold text-ait-blue ait-title">{title}</h1>
          </div>
        </div>
      );
    }

    // ==================== LOGIN ====================
    function LoginPage({ onLoginSuccess, goAdmin }) {
      const { login } = useAuth();
      const { t } = useLang();
      const [email, setEmail] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!email.trim()) return setError('Email required');
        setLoading(true); setError('');
        try {
          await login(email.trim());
          onLoginSuccess();
        } catch (err) {
          setError(err.message || 'Login failed');
        } finally { setLoading(false); }
      };

      return (
        <div className="min-h-screen flex flex-col">
          <div className="bg-gradient-to-b from-ait-blue to-ait-dark flex-1 flex flex-col items-center justify-center px-5 pt-10 pb-20">
            <div className="bg-white rounded-full p-3 shadow-xl mb-6 w-36 h-36 sm:w-44 sm:h-44 flex items-center justify-center overflow-hidden">
              <img src={AIT_LOGO} alt="AIT Logo" className="w-full h-full object-contain p-2" />
            </div>
            <h1 className="text-white text-2xl sm:text-3xl md:text-4xl font-bold text-center leading-tight mb-3 px-2">{t('login', 'title')}</h1>
            <p className="text-white/85 text-center text-sm sm:text-base max-w-sm">{t('login', 'subtitle')}</p>
          </div>
          <div className="bg-white rounded-t-3xl -mt-10 px-5 pt-8 pb-10 shadow-2xl relative z-10">
            <form onSubmit={handleSubmit} className="max-w-md mx-auto space-y-5">
              <div>
                <label className="block text-gray-600 text-sm font-medium mb-1.5">{t('login', 'email')}</label>
                <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder={t('login', 'placeholder')}
                  className="w-full border border-gray-300 rounded-xl px-4 py-3.5 text-base focus:outline-none focus:ring-2 focus:ring-ait-blue focus:border-transparent" required />
              </div>
              {error && <p className="text-red-500 text-sm">{error}</p>}
              <button type="submit" disabled={loading}
                className="w-full btn-success font-semibold py-3.5 rounded-xl text-base transition disabled:opacity-50 shadow-sm">
                {loading ? t('common', 'loading') : t('login', 'loginBtn')}
              </button>
              <button type="button" onClick={goAdmin} className="w-full text-sm text-ait-blue underline py-2">
                {t('common', 'admin')}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ==================== WELCOME ====================
    function WelcomePage({ goTo }) {
      const { user } = useAuth();
      const { t } = useLang();
      const fullName = user ? `${user.firstName} ${user.middleName || ''} ${user.lastName}`.trim() : '';

      return (
        <div className="min-h-screen bg-slate-100 flex flex-col items-center justify-center px-5 py-12">
          <div className="card max-w-md w-full p-8 text-center">
            <img src={AIT_LOGO} alt="AIT" className="w-20 h-20 mx-auto mb-4 object-contain" />
            <h1 className="text-xl sm:text-2xl font-bold text-ait-blue mb-4">{t('welcome', 'hello')} {fullName},</h1>
            <p className="text-gray-600 text-sm sm:text-base mb-8 leading-relaxed">{t('welcome', 'message')}</p>
            <button onClick={() => goTo('basic-info')} className="btn-success font-semibold py-3 px-10 rounded-xl text-base shadow-sm w-full sm:w-auto">
              {t('welcome', 'continue')}
            </button>
            <p className="mt-8 text-ait-green font-semibold">{t('welcome', 'thanks')}</p>
          </div>
        </div>
      );
    }

    // ==================== BASIC INFO ====================
    function BasicInfoPage({ goTo }) {
      const { user, updateUser } = useAuth();
      const { t } = useLang();
      const fileRef = useRef();
      const [form, setForm] = useState({
        firstName: '', middleName: '', lastName: '', email: '', contactNumber: '', otherContact: '',
        gender: 'Male', dateOfBirth: '', whatsappContact: '', homeAddress: '', countryOfOrigin: 'Togo'
      });
      const [photoPreview, setPhotoPreview] = useState(null);
      const [photoFile, setPhotoFile] = useState(null);
      const [loading, setLoading] = useState(false);
      const [msg, setMsg] = useState('');

      useEffect(() => {
        if (user) {
          setForm({
            firstName: user.firstName || '', middleName: user.middleName || '', lastName: user.lastName || '',
            email: user.email || '', contactNumber: user.contactNumber || '', otherContact: user.otherContact || '',
            gender: user.gender || 'Male',
            dateOfBirth: user.dateOfBirth ? String(user.dateOfBirth).split('T')[0] : '',
            whatsappContact: user.whatsappContact || '', homeAddress: user.homeAddress || '',
            countryOfOrigin: user.countryOfOrigin || 'Togo',
          });
          if (user.photo) {
            setPhotoPreview(user.photo.startsWith('http') ? user.photo : UPLOAD_BASE + user.photo);
          }
        }
      }, [user]);

      const handleChange = (e) => setForm({ ...form, [e.target.name]: e.target.value });
      const handlePhoto = (e) => {
        const f = e.target.files && e.target.files[0];
        if (f) { setPhotoFile(f); setPhotoPreview(URL.createObjectURL(f)); }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true); setMsg('');
        try {
          const fd = new FormData();
          Object.keys(form).forEach(k => { if (k !== 'email') fd.append(k, form[k]); });
          if (photoFile) fd.append('photo', photoFile);
          const data = await api('PUT', '/application/basic-info', fd, true);
          updateUser(data.user);
          setMsg(t('common', 'success'));
          setTimeout(() => goTo('programme'), 500);
        } catch (err) {
          setMsg(err.message || t('common', 'error'));
        } finally { setLoading(false); }
      };

      const countries = ['Togo', 'Ghana', 'Nigeria', 'Benin', 'Ivory Coast', 'Burkina Faso', 'Senegal', 'Mali', 'Niger', 'Cameroon', 'Other'];
      const inputCls = 'w-full border border-gray-300 rounded-lg px-3 py-2.5 text-base outline-none focus:ring-2 focus:ring-ait-blue focus:border-transparent';

      return (
        <div className="min-h-screen bg-slate-100 pb-12">
          <PageHeader title={t('step1', 'title')} />
          <div className="px-3 sm:px-4 mt-4 max-w-lg mx-auto">
            <div className="bg-cyan-600 text-white text-center py-3 rounded-xl font-medium mb-5 text-sm sm:text-base">{t('step1', 'banner')}</div>
            <form onSubmit={handleSubmit} className="card p-4 sm:p-6 space-y-4">
              <div className="flex flex-col items-center">
                <div className="w-36 h-44 sm:w-40 sm:h-48 bg-gray-100 rounded-lg overflow-hidden mb-2 border-2 border-gray-200 shadow-inner">
                  {photoPreview
                    ? <img src={photoPreview} alt="Photo" className="w-full h-full object-cover" />
                    : <div className="w-full h-full flex items-center justify-center text-gray-400 text-sm">No Photo</div>}
                </div>
                <button type="button" onClick={() => fileRef.current && fileRef.current.click()}
                  className="btn-success text-sm px-4 py-2 rounded-lg">{t('step1', 'changePhoto')}</button>
                <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handlePhoto} />
              </div>
              {['firstName', 'middleName', 'lastName'].map(name => (
                <div key={name}>
                  <label className="block text-sm font-medium text-gray-700 mb-1">{t('step1', name)}</label>
                  <input name={name} value={form[name]} onChange={handleChange} className={inputCls} required={name !== 'middleName'} />
                </div>
              ))}
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">{t('step1', 'email')}</label>
                <input value={form.email} disabled className="w-full border border-gray-200 rounded-lg px-3 py-2.5 bg-gray-50 text-gray-500" />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">{t('step1', 'contact')}</label>
                <input name="contactNumber" value={form.contactNumber} onChange={handleChange} className={inputCls} required />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">{t('step1', 'otherContact')}</label>
                <input name="otherContact" value={form.otherContact} onChange={handleChange} className={inputCls} />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">{t('step1', 'gender')}</label>
                <select name="gender" value={form.gender} onChange={handleChange} className={inputCls}>
                  <option value="Male">{t('step1', 'male')}</option>
                  <option value="Female">{t('step1', 'female')}</option>
                  <option value="Other">{t('step1', 'other')}</option>
                </select>
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">{t('step1', 'dob')}</label>
                <input type="date" name="dateOfBirth" value={form.dateOfBirth} onChange={handleChange} className={inputCls} required />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">{t('step1', 'whatsapp')}</label>
                <input name="whatsappContact" value={form.whatsappContact} onChange={handleChange} className={inputCls} required />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">{t('step1', 'address')}</label>
                <input name="homeAddress" value={form.homeAddress} onChange={handleChange} className={inputCls} required />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">{t('step1', 'country')}</label>
                <select name="countryOfOrigin" value={form.countryOfOrigin} onChange={handleChange} className={inputCls}>
                  {countries.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              {msg && <p className={`text-sm ${/error|erreur/i.test(msg) ? 'text-red-500' : 'text-green-600'}`}>{msg}</p>}
              <button type="submit" disabled={loading} className="w-full btn-success font-semibold py-3.5 rounded-xl disabled:opacity-50">
                {loading ? t('common', 'loading') : t('step1', 'save')}
              </button>
            </form>
          </div>
        </div>
      );
    }

    const PROGRAMMES = [
      'Baccalauréat en génie (BEng) en génie électrique',
      'Bachelor of Engineering (BEng) in Computer Engineering',
      'Bachelor of Engineering (BEng) in Civil Engineering',
      'Bachelor of Engineering (BEng) in Mechanical Engineering',
      'Bachelor of Science (BSc) in Information Technology',
      'Bachelor of Science (BSc) in Computer Science',
      'Bachelor of Business Administration (BBA)',
      'Bachelor of Science (BSc) in Accounting',
    ];
    const COURSES = ['Mathematics', 'Sciences Physiques', 'French', 'Music', 'Technical Drawing', 'Anglais', 'Histoire et Geographie', 'Education Physique et Sport', 'Biology', 'Chemistry', 'Economics', 'Accounting'];
    const GRADES = ['A1', 'B2', 'B3', 'C4', 'C5', 'C6', 'D7', 'E8', 'F9', 'NotDone'];

    // ==================== PROGRAMME ====================
    function ProgrammePage({ goTo }) {
      const { t } = useLang();
      const [choice1, setChoice1] = useState(PROGRAMMES[0]);
      const [choice2, setChoice2] = useState(PROGRAMMES[1]);
      const [choice3, setChoice3] = useState(PROGRAMMES[2]);
      const [qualification, setQualification] = useState('Baccalaureat');
      const [hasResults, setHasResults] = useState(true);
      const [grades, setGrades] = useState(COURSES.slice(0, 8).map(c => ({ course: c, grade: 'B2' })));
      const [loading, setLoading] = useState(false);
      const [msg, setMsg] = useState('');

      useEffect(() => {
        api('GET', '/application').then(data => {
          const app = data.application;
          if (app && app.programmeChoices && app.programmeChoices.length) {
            setChoice1(app.programmeChoices[0].programme || PROGRAMMES[0]);
            setChoice2((app.programmeChoices[1] && app.programmeChoices[1].programme) || PROGRAMMES[1]);
            setChoice3((app.programmeChoices[2] && app.programmeChoices[2].programme) || PROGRAMMES[2]);
          }
          if (app && app.highestQualification) setQualification(app.highestQualification);
          if (app && app.courseGrades && app.courseGrades.length) setGrades(app.courseGrades);
        }).catch(() => {});
      }, []);

      const updateGrade = (i, field, value) => {
        const next = [...grades];
        next[i] = { ...next[i], [field]: value };
        setGrades(next);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true); setMsg('');
        try {
          await api('PUT', '/application/programme-choices', {

    // ==================== DOCUMENTS (avec liste + suppression) ====================
    function DocumentsPage({ goTo }) {
      const { logout } = useAuth();
      const { t } = useLang();
      const fileRef = useRef();
      const [files, setFiles] = useState([]);
      const [existingDocs, setExistingDocs] = useState([]);
      const [loading, setLoading] = useState(false);
      const [submitted, setSubmitted] = useState(false);
      const [msg, setMsg] = useState('');

      const loadDocs = () => {
        api('GET', '/application').then(data => {
          if (data.application && data.application.documents) {
            setExistingDocs(data.application.documents);
          }
        }).catch(() => {});
      };

      useEffect(() => { loadDocs(); }, []);

      const handleFiles = (e) => { if (e.target.files) setFiles(Array.from(e.target.files)); };

      const handleUpload = async () => {
        if (files.length === 0) return setMsg('Please select at least one document');
        setLoading(true); setMsg('');
        try {
          const fd = new FormData();
          files.forEach(f => fd.append('documents', f));
          const data = await api('POST', '/application/documents', fd, true);
          setExistingDocs(data.documents || []);
          setFiles([]);
          if (fileRef.current) fileRef.current.value = '';
          setMsg('Documents uploaded successfully');
        } catch (err) {
          setMsg(err.message || t('common', 'error'));
        } finally { setLoading(false); }
      };

      const handleDelete = async (filename) => {
        if (!confirm('Delete this document?')) return;
        setLoading(true); setMsg('');
        try {
          const data = await api('DELETE', `/application/documents/${filename}`);
          setExistingDocs(data.documents || []);
          setMsg('Document deleted');
        } catch (err) {
          setMsg(err.message || t('common', 'error'));
        } finally { setLoading(false); }
      };

      const handleSubmit = async () => {
        setLoading(true); setMsg('');
        try {
          await api('POST', '/application/submit');
          setSubmitted(true);
        } catch (err) {
          setMsg(err.message || t('common', 'error'));
        } finally { setLoading(false); }
      };

      if (submitted) {
        return (
          <div className="min-h-screen bg-slate-100 flex flex-col items-center justify-center px-5 py-12">
            <div className="card max-w-md w-full p-8 text-center">
              <img src={AIT_LOGO} alt="AIT" className="w-24 h-24 mx-auto mb-5 object-contain" />
              <div className="w-16 h-16 mx-auto mb-4 rounded-full bg-green-100 flex items-center justify-center">
                <svg className="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" />
                </svg>
              </div>
              <h1 className="text-xl sm:text-2xl font-bold text-ait-blue mb-3">{t('submitted', 'title')}</h1>
              <p className="text-gray-600 text-sm sm:text-base mb-8 leading-relaxed">{t('submitted', 'message')}</p>
              <button onClick={() => { logout(); goTo('login'); }} className="btn-primary font-semibold py-3 px-8 rounded-xl w-full sm:w-auto">
                {t('submitted', 'back')}
              </button>
            </div>
          </div>
        );
      }

      const formatSize = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1024).toFixed(0) + ' KB';

      return (
        <div className="min-h-screen bg-slate-100 pb-12">
          <PageHeader title={t('step3', 'title')} />
          <div className="px-3 sm:px-4 mt-4 max-w-lg mx-auto">
            <div className="card p-4 sm:p-6 space-y-4">
              <p className="text-gray-800 text-sm sm:text-base">
                <span className="text-pink-600 font-semibold">{t('step3', 'certs')}</span>
              </p>
              <p className="text-green-700 text-sm leading-relaxed">
                <strong>Note:</strong> {t('step3', 'note')}{' '}
                <span className="text-pink-600 font-medium">{t('step3', 'whatsapp')}</span>. {t('step3', 'addName')}
              </p>

              {/* Documents existants */}
              <div className="border-t pt-4">
                <h3 className="text-ait-blue font-semibold mb-2">{t('step3', 'existing')}</h3>
                {existingDocs.length === 0 ? (
                  <p className="text-sm text-gray-500 italic">{t('step3', 'noDocs')}</p>
                ) : (
                  <ul className="space-y-2">
                    {existingDocs.map((d, i) => (
                      <li key={i} className="flex items-center justify-between gap-2 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5">
                        <a href={UPLOAD_BASE + d.path} target="_blank" rel="noopener noreferrer"
                          className="text-sm text-ait-blue underline truncate flex-1">
                          📄 {d.originalName || d.filename}
                          {d.size ? <span className="text-gray-400 no-underline ml-1">({formatSize(d.size)})</span> : null}
                        </a>
                        <button type="button" onClick={() => handleDelete(d.filename)} disabled={loading}
                          className="btn-danger text-xs px-2.5 py-1.5 rounded-lg whitespace-nowrap disabled:opacity-50">
                          {t('step3', 'delete')}
                        </button>
                      </li>
                    ))}
                  </ul>
                )}
              </div>

              {/* Upload zone */}
              <div className="border-t pt-4">
                <h3 className="text-green-700 font-semibold mb-1">Step 3</h3>
                <p className="text-sm text-gray-700 mb-3">{t('step3', 'uploadTitle')}</p>
                <div className="border-2 border-dashed border-gray-300 rounded-xl p-5 text-center bg-slate-50">
                  <div className="text-3xl mb-2">📤</div>
                  <p className="text-ait-blue font-medium text-sm">
                    {t('step3', 'uploadBtn')}{' '}
                    <button type="button" onClick={() => fileRef.current && fileRef.current.click()} className="text-pink-600 underline">
                      {t('step3', 'clickHere')}
                    </button>
                  </p>
                  <p className="text-pink-500 text-xs mt-1">{t('step3', 'multiNote')}</p>
                  <input ref={fileRef} type="file" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" className="hidden" onChange={handleFiles} />
                </div>
                {files.length > 0 && (
                  <ul className="mt-2 space-y-1">
                    {files.map((f, i) => <li key={i} className="text-sm text-gray-600 truncate">📎 {f.name}</li>)}
                  </ul>
                )}
                {msg && <p className={`text-sm mt-2 ${/error|erreur|fail/i.test(msg) ? 'text-red-500' : 'text-green-600'}`}>{msg}</p>}
                <button onClick={handleUpload} disabled={loading || files.length === 0}
                  className="w-full mt-3 bg-ait-blue hover:bg-ait-dark text-white font-semibold py-2.5 rounded-xl disabled:opacity-50 transition">
                  {loading ? t('common', 'loading') : 'Upload Selected Files'}
                </button>
                <button onClick={handleSubmit} disabled={loading}
                  className="w-full mt-3 btn-success font-semibold py-3.5 rounded-xl disabled:opacity-50">
                  {loading ? t('common', 'loading') : t('step3', 'save')}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==================== ADMIN PAGE ====================
    function AdminPage({ goBack }) {
      const { t } = useLang();
      const [password, setPassword] = useState('');
      const [authed, setAuthed] = useState(!!sessionStorage.getItem('ait_admin'));
      const [apps, setApps] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [search, setSearch] = useState('');
      const [selected, setSelected] = useState(null);
      const [statusLoading, setStatusLoading] = useState(false);

      const loadApps = async (pwd) => {
        setLoading(true); setError('');
        try {
          const data = await api('GET', '/admin/applications', null, false, { 'x-admin-password': pwd || sessionStorage.getItem('ait_admin') });
          setApps(data.applications || []);
        } catch (err) {
          setError(err.message);
          setAuthed(false);
          sessionStorage.removeItem('ait_admin');
        } finally { setLoading(false); }
      };

      useEffect(() => {
        if (authed) loadApps();
      }, [authed]);

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoading(true); setError('');
        try {
          await api('POST', '/admin/login', { password });
          sessionStorage.setItem('ait_admin', password);
          setAuthed(true);
        } catch (err) {
          setError(err.message || 'Wrong password');
        } finally { setLoading(false); }
      };

      const changeStatus = async (userId, status) => {
        setStatusLoading(true);
        try {
          await api('PATCH', `/admin/applications/${userId}/status`, { status }, false, {
            'x-admin-password': sessionStorage.getItem('ait_admin')
          });
          await loadApps();
          if (selected && selected.userId === userId) {
            setSelected({ ...selected, applicationStatus: status });
          }
        } catch (err) {
          alert(err.message);
        } finally { setStatusLoading(false); }
      };

      const filtered = apps.filter(a => {
        const q = search.toLowerCase();
        return !q || (a.fullName || '').toLowerCase().includes(q) || (a.email || '').toLowerCase().includes(q)
          || (a.contactNumber || '').includes(q);
      });

      const statusColor = (s) => ({
        draft: 'bg-gray-200 text-gray-700',
        submitted: 'bg-blue-100 text-blue-800',
        under_review: 'bg-yellow-100 text-yellow-800',
        accepted: 'bg-green-100 text-green-800',
        rejected: 'bg-red-100 text-red-800',
      }[s] || 'bg-gray-100');

      if (!authed) {
        return (
          <div className="min-h-screen bg-slate-100 flex items-center justify-center px-4">
            <form onSubmit={handleLogin} className="card p-6 sm:p-8 max-w-sm w-full space-y-4">

              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">{t('admin', 'password')}</label>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)}
                  className="w-full border border-gray-300 rounded-lg px-3 py-2.5 outline-none focus:ring-2 focus:ring-ait-blue" required />
              </div>
              {error && <p className="text-red-500 text-sm">{error}</p>}
              <button type="submit" disabled={loading} className="w-full btn-primary font-semibold py-3 rounded-xl disabled:opacity-50">
                {loading ? t('common', 'loading') : t('admin', 'login')}
              </button>
              <button type="button" onClick={goBack} className="w-full text-sm text-gray-500 underline">{t('admin', 'close')}</button>
            </form>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-100">
          <div className="bg-ait-blue text-white px-4 py-4 flex flex-wrap items-center justify-between gap-2">
            <div className="flex items-center gap-3">
              <img src={AIT_LOGO} alt="AIT" className="w-10 h-10 object-contain bg-white rounded-full p-0.5" />

                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==================== APP ====================
    function App() {
      const { token, loading } = useAuth();
      const [page, setPage] = useState('login');

      useEffect(() => {
        if (!loading) {
          if (token && page === 'login') setPage('welcome');
          if (!token && page !== 'login' && page !== 'admin') setPage('login');
        }
      }, [token, loading]);

      if (loading) {
        return <div className="flex items-center justify-center min-h-screen text-gray-500">Loading...</div>;
      }

      return (
        <div>
          <LanguageSwitcher />
          {page === 'login' && <LoginPage onLoginSuccess={() => setPage('welcome')} goAdmin={() => setPage('admin')} />}
          {page === 'admin' && <AdminPage goBack={() => setPage('login')} />}
          {page === 'welcome' && token && <WelcomePage goTo={setPage} />}
          {page === 'basic-info' && token && <BasicInfoPage goTo={setPage} />}
          {page === 'programme' && token && <ProgrammePage goTo={setPage} />}
          {page === 'documents' && token && <DocumentsPage goTo={setPage} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <AuthProvider><App /></AuthProvider>
    );
  </script>
</body>
</html>
